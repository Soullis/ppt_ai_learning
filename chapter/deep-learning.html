tic/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"ActivationsPlot\"]\nd:I[5385,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"BackpropChain\"]\ne:I[773,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.j"])</script><script>self.__next_f.push([1,"s\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"GradDescentExplainer\"]\nf:I[8381,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"BatchSizeDemo\"]\n10:I[8725,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"LossSurface\"]\n11:I[2636,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"GradientFlowDemo\"]\n12:I[4358,[\"639\",\"static/chunks/bdfe9574-9ccc1ca3525edbdd.js\",\"130\",\"static/chunks/130-084d3e3655a0a74a.js\",\"112\",\"static/chunks/112-ea560de004e53be9.js\",\"294\",\"static/chunks/app/chapter/%5Bslug%5D/page-ccd6662b034f7e2d.js\"],\"RegularizationViz\"]\n13:I[4707,[],\"\"]\n15:I[6423,[],\"\"]\n17:I[1060,[],\"\"]\n14:[\"slug\",\"deep-learning\",\"d\"]\n18:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L3\",null,{\"buildId\":\"b7hVUZppjqKc2MkrUKsOB\",\"assetPrefix\":\"/ppt_ai_learning\",\"urlParts\":[\"\",\"chapter\",\"deep-learning\"],\"initialTree\":[\"\",{\"children\":[\"chapter\",{\"children\":[[\"slug\",\"deep-learning\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"deep-learning\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"chapter\",{\"children\":[[\"slug\",\"deep-learning\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L4\",[\"$\",\"$5\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-screen bg-bone\"}],\"children\":[\"$\",\"$L6\",null,{\"chapter\":{\"id\":\"ch05\",\"number\":5,\"part\":2,\"slug\":\"deep-learning\",\"title\":\"Deep learning foundations\",\"subtitle\":\"Neurons, capacity, training, and the optimisation that makes it work\",\"slides\":[{\"id\":\"ch05-00\",\"title\":\"What is deep learning\",\"eyebrow\":\"Introduction\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Chapter 4 covered algorithms that fit a fixed, hand chosen shape to the data: a line, a tree, a kernel boundary. Deep learning is the branch of machine learning that instead builds the function itself out of many small, identical pieces stacked on top of each other, called layers, and lets training decide what each piece should compute. The word deep simply refers to having several of these layers between the input and the output.\"}],[\"$\",\"p\",null,{\"children\":\"The basic piece is the artificial neuron, a simplified model of a biological neuron proposed by McCulloch and Pitts in 1943 and turned into a trainable unit by Rosenblatt's perceptron in 1958. A single neuron computes the same thing as the logistic regression from chapter 4. What deep learning adds is depth, stacking many neurons in many layers so the network can build complex functions out of these simple parts, each layer transforming the representation produced by the one before it.\"}],[\"$\",\"p\",null,{\"children\":\"The field went through a difficult period after Minsky and Papert showed in 1969 that a single neuron cannot represent even the simple XOR function, which slowed the research area down for over a decade. It came back once backpropagation, popularised by Rumelhart, Hinton, and Williams in 1986, gave a practical way to train many layers at once, and it became the default approach once enough labelled data and enough compute were available, GPU training on ImageNet in 2012 is the year usually cited for that shift. Chapter 1 has the full timeline. This chapter builds the training machinery in order: the neuron, why depth requires non-linearity, how a network is trained end to end. Chapter 6 covers the architecture families that reuse this same loop.\"}]]}]},{\"id\":\"ch05-01\",\"title\":\"The perceptron\",\"eyebrow\":\"Unit\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"$L7\",null,{\"children\":\"y = \\\\sigma\\\\!\\\\Big(\\\\sum_i w_i x_i + b\\\\Big) = \\\\sigma(w^\\\\top x + b)\"}],[\"$\",\"p\",null,{\"children\":[\"A perceptron takes a weighted sum of its inputs, adds a bias, and passes the result through an activation \",[\"$\",\"$L8\",null,{\"children\":\"\\\\sigma\"}],\". This is exactly logistic regression from chapter 4, one weight per input, one bias, one non-linearity at the output. Rosenblatt built it as a physical machine, the Mark I Perceptron, that adjusted its own weights whenever it misclassified an example, the same idea of learning from mistakes that gradient based training generalises later in this chapter.\"]}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"Reference\"}],[\"$\",\"div\",null,{\"children\":[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://psycnet.apa.org/record/1959-09865-001\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"Rosenblatt 1958\"}]}]]}]]}],\"viz\":[\"$\",\"$L9\",null,{}]},{\"id\":\"ch05-02\",\"title\":\"Linear limitation and the XOR problem\",\"eyebrow\":\"Capacity\",\"layout\":\"wideViz\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"A single neuron can only separate the input space with one straight line, formally one hyperplane. It can only solve problems where the two classes can be split by such a boundary, linearly separable problems.\"}],[\"$\",\"p\",null,{\"children\":[\"The XOR function is the classic example where this fails. It has four points,\",\" \",[\"$\",\"$L8\",null,{\"children\":\"(0,0),(0,1),(1,0),(1,1)\"}],\", with labels \",[\"$\",\"$L8\",null,{\"children\":\"\\\\{0,1,1,0\\\\}\"}],\". Try drawing a single straight line that puts the two points labelled 1 on one side and the two labelled 0 on the other, it cannot be done, no matter where the line is placed. Minsky and Papert used exactly this example in 1969 to show the limit of a single neuron.\"]}],[\"$\",\"p\",null,{\"children\":\"The left panel below cycles through candidate lines a single perceptron could learn, none of them separates the classes. The right panel shows the fix: two hidden units, each contributing its own line, combined by an output neuron into the two diagonal regions XOR needs. The next two slides explain in detail why this combination works.\"}]]}],\"viz\":[\"$\",\"$La\",null,{}]},{\"id\":\"ch05-02b\",\"title\":\"XOR by hand: one training step\",\"eyebrow\":\"Worked example\",\"layout\":\"scrollProse\",\"tier\":\"deep\",\"notes\":\"Board script. PT: estamos achando como cada peso afeta a perda final; com a regra da cadeia obtemos as derivadas locais; o gradiente nos dá direção e magnitude em que a perda sobe mais rápido; atualizamos o peso no sentido oposto.\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4 text-[14px]\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"Network: 2 inputs → 2 hidden (sigmoid) → 1 output (sigmoid). Example\",\" \",[\"$\",\"$L8\",null,{\"children\":\"x=(1,0)\"}],\", target \",[\"$\",\"$L8\",null,{\"children\":\"y=1\"}],\". Initial weights (illustrative):\"]}],[\"$\",\"$L7\",null,{\"children\":\"W^{(1)}=\\\\begin{bmatrix}0.5\u0026-0.5\\\\\\\\0.5\u00260.5\\\\end{bmatrix},\\\\ b^{(1)}=0,\\\\quad W^{(2)}=[1\\\\ {-1}],\\\\ b^{(2)}=0\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Forward.\"}],\" Hidden pre activations\",\" \",[\"$\",\"$L8\",null,{\"children\":\"z^{(1)}=W^{(1)}x=[0.5,0.5]^\\\\top\"}],\", hidden activations\",\" \",[\"$\",\"$L8\",null,{\"children\":\"h=\\\\sigma(z^{(1)}\\\\!)\\\\approx[0.62,0.62]^\\\\top\"}],\". Output\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\hat p=\\\\sigma(W^{(2)}h)\\\\approx\\\\sigma(0)\\\\approx0.5\"}],\".\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Loss.\"}],\" Binary cross entropy for this one example:\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\mathcal{L}=-\\\\log\\\\hat p\\\\approx0.69\"}],\".\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Backward (one edge).\"}],\" Output delta\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\delta^{(2)}=\\\\hat p-y=-0.5\"}],\". Gradient for weight\",\" \",[\"$\",\"$L8\",null,{\"children\":\"W^{(2)}_1\"}],\" (first hidden → output):\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\partial\\\\mathcal{L}/\\\\partial W^{(2)}_1=\\\\delta^{(2)}\\\\,h_1\\\\approx-0.31\"}],\". The negative sign means increasing this weight would \",[\"$\",\"em\",null,{\"children\":\"reduce\"}],\" the loss.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Update.\"}],\" With learning rate \",[\"$\",\"$L8\",null,{\"children\":\"\\\\eta=0.5\"}],\":\",\" \",[\"$\",\"$L8\",null,{\"children\":\"W^{(2)}_1\\\\leftarrow W^{(2)}_1-\\\\eta\\\\,(\\\\partial\\\\mathcal{L}/\\\\partial W^{(2)}_1)\\\\approx1.16\"}],\". Repeat forward and backward for the other weights and for all four XOR points each epoch.\"]}]]}]},{\"id\":\"ch05-03\",\"title\":\"Hidden layers: stacking neurons\",\"eyebrow\":\"Depth\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Each neuron in a layer defines its own hyperplane, exactly like the single perceptron above. A layer with several neurons does not draw one line, it draws several at once, one per neuron, cutting the input space into many regions.\"}],[\"$\",\"p\",null,{\"children\":\"The next layer takes those regions as its input and recombines them, turning on for whatever pattern of half-planes the weights encode. This is why stacking neurons adds capacity: more neurons per layer means more boundaries to combine, and more layers means those combinations can be combined again into increasingly complex shapes.\"}],[\"$\",\"$L7\",null,{\"children\":\"h^{(\\\\ell)} = \\\\phi\\\\!\\\\big(W^{(\\\\ell)} h^{(\\\\ell-1)} + b^{(\\\\ell)}\\\\big)\"}],[\"$\",\"p\",null,{\"children\":[\"Layer \",[\"$\",\"$L8\",null,{\"children\":\"\\\\ell\"}],\" applies a weight matrix and a bias to the previous layer's output, then the non-linear function \",[\"$\",\"$L8\",null,{\"children\":\"\\\\phi\"}],\" from the next slide. A network with a single hidden layer of enough neurons can already approximate any continuous function on a bounded input, the universal approximation theorem (Cybenko, 1989). In practice going deeper rather than only wider tends to reach the same accuracy with far fewer parameters, since each new layer reuses the features the previous layer already built.\"]}]]}],\"viz\":[\"$\",\"$Lb\",null,{\"layers\":[2,4,4,1]}]},{\"id\":\"ch05-04\",\"title\":\"Why non-linearity is required\",\"eyebrow\":\"Activations\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Stacking layers only helps if something non-linear happens between them. Without it, two linear layers collapse into a single linear layer:\"}],[\"$\",\"$L7\",null,{\"children\":\"W_2(W_1 x + b_1) + b_2 = (W_2 W_1)x + (W_2 b_1 + b_2)\"}],[\"$\",\"p\",null,{\"children\":[\"No matter how many layers are stacked, the composition of linear functions is still linear, so it still draws only one hyperplane and still cannot solve XOR. The activation function \",[\"$\",\"$L8\",null,{\"children\":\"\\\\phi\"}],\" applied after each layer is what lets each hidden neuron contribute its own bent boundary instead of being absorbed into one overall line.\"]}],[\"$\",\"p\",null,{\"children\":\"Adding a hidden layer and adding a non-linear activation are therefore not two separate fixes, they are one fix: layer plus non-linearity together are what give a network extra representational power. This is exactly what the right panel of the previous slide showed, two hidden units, each with its own boundary, combined non-linearly at the output to produce a shape a single line never could.\"}]]}]},{\"id\":\"ch05-05\",\"title\":\"Width versus depth\",\"eyebrow\":\"Capacity\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Width means adding more neurons to the same layer, which adds more independent boundaries at that stage. Depth means adding more layers, letting the network build features out of the previous layer's features, edges combine into textures, textures into parts, parts into objects, the pattern chapter 7 walks through for images.\"}],[\"$\",\"p\",null,{\"children\":\"For a fixed number of parameters, depth is usually more efficient than width, but very deep networks are harder to train: longer chains of layers make backpropagation multiply more terms together on the way back, which is one of the reasons a network like ResNet-152 (chapter 7) needs skip connections that let gradients bypass layers directly.\"}]]}]},{\"id\":\"ch05-06\",\"title\":\"Activation functions\",\"eyebrow\":\"Activations\",\"layout\":\"wideViz\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-3 text-[13.5px] leading-relaxed\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Sigmoid\"}],\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\sigma(z){=}\\\\tfrac{1}{1+e^{-z}}\"}],\", derivative\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\sigma'(z){=}\\\\sigma(z)(1{-}\\\\sigma(z))\"}],\". Squashes to \",[\"$\",\"$L8\",null,{\"children\":\"(0,1)\"}],\", the first choice historically because it reads as a probability, but it saturates for large\",\" \",[\"$\",\"$L8\",null,{\"children\":\"|z|\"}],\": the derivative shrinks toward zero and gradients vanish through many layers.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Tanh\"}],\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\tanh(z){=}\\\\tfrac{e^z-e^{-z}}{e^z+e^{-z}}\"}],\", derivative\",\" \",[\"$\",\"$L8\",null,{\"children\":\"1{-}\\\\tanh^2(z)\"}],\". Bounded in \",[\"$\",\"$L8\",null,{\"children\":\"(-1,1)\"}],\" and zero centred, which usually trains a little better than sigmoid, but it still saturates at the extremes the same way.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"ReLU\"}],\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\mathrm{ReLU}(z){=}\\\\max(0,z)\"}],\", derivative\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\mathbb{1}_{z\u003e0}\"}],\". Zero for negative input, identity for positive input, cheap to compute, never saturates for \",[\"$\",\"$L8\",null,{\"children\":\"z\u003e0\"}],\", the default in convolutional networks since AlexNet (2012).\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"GELU\"}],\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\mathrm{GELU}(z){=}z\\\\cdot\\\\Phi(z)\"}],\". A smooth version of ReLU that lets a small negative signal through instead of a hard zero, the standard choice in transformers.\"]}],[\"$\",\"p\",null,{\"className\":\"pt-1 text-muted\",\"children\":\"The plot compares all four on the same axes: sigmoid and tanh flatten at the extremes while ReLU and GELU keep growing for large positive input, the saturation difference that matters most once we look at how gradients travel through many layers.\"}]]}],\"viz\":[\"$\",\"$Lc\",null,{}]},{\"id\":\"ch05-07\",\"title\":\"Entropy\",\"eyebrow\":\"Information\",\"layout\":\"scrollProse\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"Entropy measures how uncertain a probability distribution is. For discrete classes with probabilities \",[\"$\",\"$L8\",null,{\"children\":\"p_k\"}],\":\"]}],[\"$\",\"$L7\",null,{\"children\":\"H(p) = -\\\\sum_k p_k \\\\log p_k\"}],[\"$\",\"p\",null,{\"children\":\"High entropy when the distribution is flat (many outcomes equally likely). Low entropy when one class dominates. The log is usually base 2 (bits) or natural log (nats); the choice only scales the number, not the ordering.\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":[\"Example: fair coin \",[\"$\",\"$L8\",null,{\"children\":\"p=(0.5,0.5)\"}],\" has entropy 1 bit. Certain outcome\",\" \",[\"$\",\"$L8\",null,{\"children\":\"p=(1,0)\"}],\" has entropy 0.\"]}]]}]},{\"id\":\"ch05-08\",\"title\":\"Cross entropy and KL divergence\",\"eyebrow\":\"Objective\",\"layout\":\"scrollProse\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"Cross entropy compares a true distribution \",[\"$\",\"$L8\",null,{\"children\":\"p\"}],\" to a predicted distribution\",\" \",[\"$\",\"$L8\",null,{\"children\":\"\\\\hat p\"}],\":\"]}],[\"$\",\"$L7\",null,{\"children\":\"H(p, \\\\hat p) = -\\\\sum_k p_k \\\\log \\\\hat p_k\"}],[\"$\",\"p\",null,{\"children\":[\"When the target is a one hot label, only one term survives. For two classes this is binary cross entropy (BCE). For \",[\"$\",\"$L8\",null,{\"children\":\"K\"}],\" classes with softmax output:\"]}],[\"$\",\"$L7\",null,{\"children\":\"\\\\mathcal{L}_{\\\\mathrm{CE}} = -\\\\frac{1}{N}\\\\sum_i \\\\sum_k y_{ik} \\\\log \\\\hat p_{ik}\"}],[\"$\",\"p\",null,{\"children\":[\"KL divergence measures how much extra uncertainty \",[\"$\",\"$L8\",null,{\"children\":\"\\\\hat p\"}],\" adds beyond the true distribution:\"]}],[\"$\",\"$L7\",null,{\"children\":\"D_{\\\\mathrm{KL}}(p \\\\| \\\\hat p) = \\\\sum_k p_k \\\\log\\\\frac{p_k}{\\\\hat p_k}\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":[\"When \",[\"$\",\"$L8\",null,{\"children\":\"p\"}],\" is fixed, cross entropy decomposes as\",\" \",[\"$\",\"$L8\",null,{\"children\":\"H(p,\\\\hat p)=H(p)+D_{\\\\mathrm{KL}}(p\\\\|\\\\hat p)\"}],\". Minimising cross entropy therefore pushes \",[\"$\",\"$L8\",null,{\"children\":\"\\\\hat p\"}],\" toward \",[\"$\",\"$L8\",null,{\"children\":\"p\"}],\". Knowledge distillation uses a teacher's soft probabilities as \",[\"$\",\"$L8\",null,{\"children\":\"p\"}],\" instead of hard labels.\"]}]]}]},{\"id\":\"ch05-09\",\"title\":\"Loss functions\",\"eyebrow\":\"Objective\",\"layout\":\"scrollProse\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"A loss function is a single number, written \",[\"$\",\"$L8\",null,{\"children\":\"\\\\mathcal{L}(\\\\theta)\"}],\", that measures how wrong the network's predictions are for the current parameters \",[\"$\",\"$L8\",null,{\"children\":\"\\\\theta\"}],\". Training searches for the \",[\"$\",\"$L8\",null,{\"children\":\"\\\\theta\"}],\" that makes this number as small as possible on the training set, while a validation set is used to check the network is generalising rather than memorising.\"]}],[\"$\",\"p\",null,{\"children\":\"Regression problems, where the target is a number, use mean squared error:\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\mathcal{L}_{\\\\mathrm{MSE}} = \\\\frac{1}{N}\\\\sum_{i=1}^{N}(y_i - \\\\hat y_i)^2\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"The average squared distance between prediction and target. Squaring means large errors are penalised much more heavily than small ones, and the function is smooth everywhere, which optimisation needs.\"}],[\"$\",\"p\",null,{\"children\":\"Classification problems use cross entropy from the previous slide. For two classes:\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\mathcal{L}_{\\\\mathrm{BCE}} = -\\\\frac{1}{N}\\\\sum_i \\\\big[y_i \\\\log \\\\hat p_i + (1-y_i)\\\\log(1-\\\\hat p_i)\\\\big]\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":[\"It compares the predicted probability \",[\"$\",\"$L8\",null,{\"children\":\"\\\\hat p_i\"}],\" to the true label 0 or 1, and grows without bound as a confident prediction gets it wrong, pushing training hard exactly when the model is confidently mistaken.\"]}],[\"$\",\"div\",null,{\"className\":\"overflow-hidden rounded-md border border-stroke text-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full border-collapse\",\"children\":[[\"$\",\"thead\",null,{\"children\":[\"$\",\"tr\",null,{\"className\":\"bg-bone font-mono text-[11px] uppercase text-muted\",\"children\":[[\"$\",\"th\",null,{\"className\":\"border-b border-stroke px-4 py-2\",\"children\":\"Task\"}],[\"$\",\"th\",null,{\"className\":\"border-b border-stroke px-4 py-2\",\"children\":\"Typical loss\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",\"Regression\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Regression\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"MSE, MAE\"}]]}],[\"$\",\"tr\",\"Classification\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Classification\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"cross-entropy\"}]]}],[\"$\",\"tr\",\"Detection\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Detection\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"cls + box (GIoU/CIoU) + objectness — ch. 11\"}]]}],[\"$\",\"tr\",\"Segmentation\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Segmentation\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"per-pixel CE + Dice — ch. 12\"}]]}]]}]]}]}]]}]},{\"id\":\"ch05-10\",\"title\":\"Backpropagation\",\"eyebrow\":\"Gradients\",\"layout\":\"scrollSplit\",\"notes\":\"PT: estamos achando como cada peso afeta a perda final; com a regra da cadeia obtemos as derivadas locais; o gradiente nos dá direção e magnitude em que a perda sobe mais rápido; atualizamos o peso no sentido oposto.\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Once the loss is defined, we need to know how to change every weight to make it smaller. For each weight, the gradient is a single number: how much the final loss would increase if that weight increased slightly. Backpropagation computes this by the chain rule: local derivatives along the path from the loss back to that weight multiply into the direction and magnitude of steepest increase. Gradient descent moves the weight in the opposite direction.\"}],[\"$\",\"p\",null,{\"children\":\"The network is a composition of functions, one per layer, followed by the loss. To get the derivative with respect to an early weight, the chain rule multiplies together the local derivative of every step on the path from the loss back to that weight:\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\frac{\\\\partial \\\\mathcal{L}}{\\\\partial w_1} = \\\\frac{\\\\partial \\\\mathcal{L}}{\\\\partial \\\\hat y}\\\\cdot\\\\frac{\\\\partial \\\\hat y}{\\\\partial z_2}\\\\cdot\\\\frac{\\\\partial z_2}{\\\\partial h}\\\\cdot\\\\frac{\\\\partial h}{\\\\partial z_1}\\\\cdot\\\\frac{\\\\partial z_1}{\\\\partial w_1}\"}],[\"$\",\"p\",null,{\"children\":[\"Read left to right: \",[\"$\",\"$L8\",null,{\"children\":\"\\\\partial \\\\mathcal{L}/\\\\partial \\\\hat y\"}],\" is how sensitive the loss is to the final prediction, computed directly from the loss formula. Each following term is the local derivative of one layer with respect to its own input, how much a small change there changes the next quantity. Multiplying them all gives the total effect of\",\" \",[\"$\",\"$L8\",null,{\"children\":\"w_1\"}],\" on the loss, propagated backward through every layer it passed through on the forward pass, which is where the name comes from.\"]}],[\"$\",\"p\",null,{\"children\":[\"In practice the algorithm runs in two passes, shown in the diagram. The forward pass computes and stores every intermediate value, \",[\"$\",\"$L8\",null,{\"children\":\"z_1, h, z_2, \\\\hat y\"}],\", exactly as drawn on top. The backward pass then walks the same graph in reverse, reusing those stored values to compute each local derivative and multiplying as it goes, shown on the bottom. Every weight gets its gradient this way in a single backward pass, regardless of how many weights there are, which is what makes training large networks computationally feasible.\"]}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"Frameworks such as PyTorch and JAX implement this automatically, called autograd, so day to day the chain rule is rarely written out by hand.\"}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"From scratch\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://github.com/samuellimabraz/cafedl\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"cafedl\"}],\" implements autograd in Java.\"]}]]}]]}],\"viz\":[\"$\",\"$Ld\",null,{}]},{\"id\":\"ch05-11\",\"title\":\"Gradient descent\",\"eyebrow\":\"Optimisation\",\"layout\":\"scrollSplit\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Backpropagation gives the gradient, the direction the loss increases fastest in. Gradient descent is the rule that uses it to update the parameters, taking a small step in the opposite direction since the goal is to make the loss go down:\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\theta_{t+1} = \\\\theta_t - \\\\eta\\\\,\\\\nabla_\\\\theta \\\\mathcal{L}(\\\\theta_t)\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"\\\\eta\"}],\" is the learning rate, chosen before training, controlling how big each step is. Too small and training crawls, needing many more steps to reach a good solution. Too large and the update overshoots the minimum, sometimes making the loss worse at every step instead of better, diverging rather than converging.\"]}],[\"$\",\"p\",null,{\"children\":[\"On the right, the curve is the loss as a function of a single parameter \",[\"$\",\"$L8\",null,{\"children\":\"\\\\theta\"}],\", the tangent line is the local slope the gradient measures at the current point, and the horizontal arrow is the step the update takes, its length set by \",[\"$\",\"$L8\",null,{\"children\":\"\\\\eta\"}],\" times that slope. The slider changes \",[\"$\",\"$L8\",null,{\"children\":\"\\\\eta\"}],\" directly, showing how it changes whether, and how fast, the point settles at the minimum \",[\"$\",\"$L8\",null,{\"children\":\"\\\\theta^*\"}],\".\"]}],[\"$\",\"p\",null,{\"children\":[\"Training repeats this update many times. One full pass through the training set is called an \",[\"$\",\"strong\",null,{\"children\":\"epoch\"}],\". Within an epoch the data is split into batches (next slide), and each single weight update is one \",[\"$\",\"strong\",null,{\"children\":\"step\"}],\" or \",[\"$\",\"strong\",null,{\"children\":\"iteration\"}],\". A typical run does tens to hundreds of epochs, each made of many steps, gradually reducing the loss until it stops improving on the validation set.\"]}]]}],\"viz\":[\"$\",\"$Le\",null,{}]},{\"id\":\"ch05-12\",\"title\":\"Batch, mini-batch, and stochastic gradient descent\",\"eyebrow\":\"Optimisation\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Computing the exact gradient at every step means averaging over the entire training set, full batch gradient descent. It is accurate but expensive once the dataset has millions of examples, since one step then needs a full pass over all of them.\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\theta_{t+1} = \\\\theta_t - \\\\eta \\\\nabla_\\\\theta \\\\frac{1}{B}\\\\sum_{i \\\\in \\\\mathcal{B}} \\\\ell_i\"}],[\"$\",\"p\",null,{\"children\":[\"Stochastic gradient descent instead estimates the gradient from a mini-batch of \",[\"$\",\"$L8\",null,{\"children\":\"B\"}],\" \",\"examples at a time, commonly between 8 and 512 in practice. Each estimate is noisier than the full batch average, but it is far cheaper per step, and the noise itself often helps training avoid sharp minima that generalise poorly. \",[\"$\",\"$L8\",null,{\"children\":\"B=1\"}],\" is the extreme case, one example per step, pure stochastic gradient descent. Most training in practice sits in between, a mini-batch.\"]}]]}],\"viz\":[\"$\",\"$Lf\",null,{}]},{\"id\":\"ch05-13\",\"title\":\"Optimisers: momentum, RMSProp, Adam\",\"eyebrow\":\"Beyond plain SGD\",\"layout\":\"scrollSplit\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Plain gradient descent treats every step independently and uses the same learning rate for every parameter. Three ideas build on top of it.\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Momentum\"}],\" keeps a running average of past gradients, called velocity, and updates using it instead of the raw gradient:\"]}],[\"$\",\"$L7\",null,{\"children\":\"v_t = \\\\beta v_{t-1} + \\\\nabla_\\\\theta \\\\mathcal{L}, \\\\qquad \\\\theta_{t+1} = \\\\theta_t - \\\\eta\\\\, v_t\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"This smooths out the zig zag plain gradient descent produces on curved loss surfaces and keeps moving in directions that have been consistently downhill over recent steps.\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"RMSProp\"}],\" keeps a running average of the squared gradient for every parameter and divides the step by its square root:\"]}],[\"$\",\"$L7\",null,{\"children\":\"s_t = \\\\beta s_{t-1} + (1-\\\\beta)(\\\\nabla_\\\\theta \\\\mathcal{L})^2, \\\\qquad \\\\theta_{t+1} = \\\\theta_t - \\\\frac{\\\\eta}{\\\\sqrt{s_t}+\\\\varepsilon}\\\\nabla_\\\\theta \\\\mathcal{L}\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"Parameters with large recent gradients get smaller steps, and parameters that have been nearly flat get relatively larger steps, effectively giving every parameter its own learning rate.\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Adam\"}],\" combines both, momentum for the direction and a per parameter adaptive step size from RMSProp:\"]}],[\"$\",\"$L7\",null,{\"children\":\"m_t = \\\\beta_1 m_{t-1} + (1-\\\\beta_1)\\\\nabla_\\\\theta \\\\mathcal{L}, \\\\qquad v_t = \\\\beta_2 v_{t-1} + (1-\\\\beta_2)(\\\\nabla_\\\\theta \\\\mathcal{L})^2\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\theta_{t+1} = \\\\theta_t - \\\\eta \\\\frac{\\\\hat m_t}{\\\\sqrt{\\\\hat v_t} + \\\\varepsilon}, \\\\qquad \\\\hat m_t = \\\\frac{m_t}{1-\\\\beta_1^t}, \\\\ \\\\hat v_t = \\\\frac{v_t}{1-\\\\beta_2^t}\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"Adam is the default optimiser in almost every Nectar trainer, YOLO, DETR, RF-DETR, because it needs little tuning and converges reliably. Plain SGD with momentum is still preferred for some very large scale training runs, where the extra tuning effort pays off in final accuracy.\"}]]}],\"viz\":[\"$\",\"$L10\",null,{}]},{\"id\":\"ch05-14\",\"title\":\"Weight initialisation\",\"eyebrow\":\"Training\",\"layout\":\"prose\",\"tier\":\"reference\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"The scale of the initial random weights matters because backpropagation multiplies many of them together on the way back through the network. If the initial weights are too small, activations shrink toward zero layer after layer, if they are too large, they grow without bound, both before training has even made any progress.\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\mathrm{Xavier:}\\\\quad W \\\\sim \\\\mathcal{U}\\\\!\\\\left[-\\\\sqrt{\\\\frac{6}{n_{in}+n_{out}}}, \\\\sqrt{\\\\frac{6}{n_{in}+n_{out}}}\\\\right]\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\mathrm{He:}\\\\quad W \\\\sim \\\\mathcal{N}\\\\!\\\\left(0, \\\\frac{2}{n_{in}}\\\\right) \\\\quad \\\\text{(for ReLU)}\"}],[\"$\",\"p\",null,{\"children\":\"Both choose the random scale so the variance of the signal stays roughly constant from layer to layer. Xavier is derived for sigmoid or tanh, He accounts for the fact that ReLU zeroes out half of its input on average, and uses a wider spread to compensate.\"}]]}]},{\"id\":\"ch05-15\",\"title\":\"Vanishing and exploding gradients\",\"eyebrow\":\"Training\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"The chain rule at the heart of backpropagation multiplies one local derivative per layer. If most of these derivatives are smaller than one, as happens once sigmoid or tanh saturate, the product shrinks toward zero across many layers, the earliest layers get almost no gradient and effectively stop learning, called vanishing gradients. If the local derivatives or the weights are consistently larger than one, the product grows without bound instead, exploding gradients, and updates become unstable, jumping far in a single step.\"}],[\"$\",\"p\",null,{\"children\":\"ReLU helps because its derivative is exactly one for any positive input, so it does not shrink the signal along that path, and skip connections (chapter 7) give the gradient an extra route that bypasses several layers entirely. The buttons on the right compare how gradient magnitude behaves layer by layer in each regime.\"}]]}],\"viz\":[\"$\",\"$L11\",null,{}]},{\"id\":\"ch05-16\",\"title\":\"Batch normalisation\",\"eyebrow\":\"Stabilisation\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"As training updates the weights of early layers, the distribution of activations reaching later layers keeps shifting, forcing those later layers to constantly readjust. Batch normalisation fixes the scale of activations at every layer by normalising them within each mini-batch:\"}],[\"$\",\"$L7\",null,{\"children\":\"\\\\hat x = \\\\frac{x - \\\\mu_B}{\\\\sqrt{\\\\sigma_B^2 + \\\\varepsilon}}, \\\\quad y = \\\\gamma \\\\hat x + \\\\beta\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"\\\\mu_B\"}],\" and \",[\"$\",\"$L8\",null,{\"children\":\"\\\\sigma_B^2\"}],\" are the mean and variance computed over the current batch. \",[\"$\",\"$L8\",null,{\"children\":\"\\\\gamma\"}],\" and \",[\"$\",\"$L8\",null,{\"children\":\"\\\\beta\"}],\" are learned parameters that let the network undo the normalisation if that turns out to help, so it never removes capacity, only stabilises the starting point, and it allows using a larger learning rate safely. Transformers normalise per token instead of per batch, called layer normalisation, since sequence length and batch composition vary too much for a per batch statistic to be reliable there.\"]}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"Reference\"}],[\"$\",\"div\",null,{\"children\":[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://arxiv.org/abs/1502.03167\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"Ioffe \u0026 Szegedy 2015\"}]}]]}]]}]},{\"id\":\"ch05-17\",\"title\":\"Regularisation\",\"eyebrow\":\"Generalisation\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-3\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[14px] text-muted\",\"children\":\"A network with enough capacity can memorise the training set instead of learning the general pattern, the overfitting problem from chapter 4. These techniques fight it directly:\"}],[\"$\",\"ul\",null,{\"className\":\"space-y-2 text-[14px]\",\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Dropout\"}],\" — zero random activations during training\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Weight decay\"}],\" — add \",[\"$\",\"$L8\",null,{\"children\":\"\\\\lambda\\\\|W\\\\|^2\"}],\" to loss\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Early stopping\"}],\" — halt when val loss rises\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Augmentation\"}],\" — chapter 13\"]}]]}]]}],\"viz\":[\"$\",\"$L12\",null,{}]},{\"id\":\"ch05-18\",\"title\":\"Beyond the MLP\",\"eyebrow\":\"Preview\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"This chapter built the universal training loop on a feedforward MLP: forward pass, loss, backpropagation, optimiser step. The same loop applies to every architecture family.\"}],[\"$\",\"p\",null,{\"children\":\"Specialised layers change the forward pass only: convolution for local spatial structure, recurrence for sequences, attention for direct links between distant positions. Chapter 6 covers each family with its defining operation and diagram. Chapter 7 goes deep on convolution for computer vision.\"}]]}]},{\"id\":\"ch05-19\",\"title\":\"PyTorch minimal example\",\"eyebrow\":\"Code\",\"layout\":\"scrollProse\",\"content\":[\"$\",\"div\",null,{\"className\":\"rounded-md border border-stroke bg-surface\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center justify-between border-b border-stroke px-3 py-1.5 font-mono text-[11px] uppercase tracking-[0.1em] text-muted\",\"children\":[[\"$\",\"span\",null,{\"children\":\"train_step.py\"}],[\"$\",\"span\",null,{\"children\":\"python\"}]]}],[\"$\",\"pre\",null,{\"className\":\"overflow-x-auto px-4 py-3 text-[13px] leading-relaxed\",\"children\":[\"$\",\"code\",null,{\"className\":\"font-mono text-ink\",\"children\":\"import torch, torch.nn as nn\\n\\nmodel = nn.Sequential(\\n    nn.Linear(784, 128), nn.ReLU(),\\n    nn.Linear(128, 10),\\n)\\nopt = torch.optim.Adam(model.parameters(), lr=1e-3)\\nloss_fn = nn.CrossEntropyLoss()\\n\\nfor x, y in loader:\\n    opt.zero_grad()\\n    logits = model(x.view(x.size(0), -1))\\n    loss = loss_fn(logits, y)\\n    loss.backward()\\n    opt.step()\"}]}]]}]},{\"id\":\"ch05-20\",\"title\":\"Interactive demos\",\"eyebrow\":\"Practice\",\"layout\":\"prose\",\"tier\":\"reference\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-2\",\"children\":[[\"$\",\"a\",\"https://playground.tensorflow.org/\",{\"href\":\"https://playground.tensorflow.org/\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"underline text-[15px]\",\"children\":[\"Ten
