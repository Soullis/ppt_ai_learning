":\"Neural network architectures\",\"subtitle\":\"From MLP to convolution, recurrence, attention, and multimodal stacks\",\"slides\":[{\"id\":\"ch06-00\",\"title\":\"From MLP to structured models\",\"eyebrow\":\"Introduction\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Chapter 5 built the training loop on a feedforward MLP: forward pass, loss, backpropagation, optimiser step. Every architecture family in this chapter reuses that exact loop. What changes is the forward pass: which operation connects one layer to the next.\"}],[\"$\",\"p\",null,{\"children\":\"An MLP treats every input dimension as independent until a dense weight matrix mixes them. Real data often has structure: pixels are local, words arrive in order, images and text describe the same scene. Specialised layers encode that structure as an inductive bias.\"}]]}],\"viz\":[\"$\",\"$L7\",null,{}]},{\"id\":\"ch06-01\",\"title\":\"Inductive bias\",\"eyebrow\":\"Choice\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Choosing an architecture is choosing what patterns the model can represent efficiently. A CNN assumes that useful features are local and translation invariant. An RNN assumes order matters and earlier tokens affect later ones. A transformer assumes any position may depend on any other, at the cost of more compute.\"}],[\"$\",\"div\",null,{\"className\":\"overflow-hidden rounded-md border border-stroke text-sm\",\"children\":[\"$\",\"table\",null,{\"className\":\"w-full border-collapse\",\"children\":[[\"$\",\"thead\",null,{\"children\":[\"$\",\"tr\",null,{\"className\":\"bg-bone font-mono text-[11px] uppercase text-muted\",\"children\":[[\"$\",\"th\",null,{\"className\":\"border-b border-stroke px-4 py-2\",\"children\":\"Input type\"}],[\"$\",\"th\",null,{\"className\":\"border-b border-stroke px-4 py-2\",\"children\":\"Typical family\"}]]}]}],[\"$\",\"tbody\",null,{\"children\":[[\"$\",\"tr\",\"Tabular features\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Tabular features\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"MLP\"}]]}],[\"$\",\"tr\",\"Image grid\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Image grid\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"CNN (chapter 7)\"}]]}],[\"$\",\"tr\",\"Time series, text tokens\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Time series, text tokens\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"RNN / LSTM / Transformer\"}]]}],[\"$\",\"tr\",\"Image + text\",{\"className\":\"border-b border-stroke\",\"children\":[[\"$\",\"td\",null,{\"className\":\"px-4 py-2\",\"children\":\"Image + text\"}],[\"$\",\"td\",null,{\"className\":\"px-4 py-2 text-muted\",\"children\":\"Multimodal dual encoder\"}]]}]]}]]}]}]]}]},{\"id\":\"ch06-02\",\"title\":\"MLP recap\",\"eyebrow\":\"Baseline\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"$L8\",null,{\"children\":\"h^{(\\\\ell)} = \\\\phi\\\\!\\\\big(W^{(\\\\ell)} h^{(\\\\ell-1)} + b^{(\\\\ell)}\\\\big)\"}],[\"$\",\"p\",null,{\"children\":\"Each neuron connects to every neuron in the previous layer. There is no weight sharing: the network must relearn the same pattern at every spatial location or time step. MLPs work well on tabular data and as the final classification head on top of other blocks.\"}]]}],\"viz\":[\"$\",\"$L9\",null,{\"layers\":[4,6,6,3]}]},{\"id\":\"ch06-03\",\"title\":\"Recurrent networks\",\"eyebrow\":\"Sequences\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"$L8\",null,{\"children\":\"h_t = \\\\phi(W_h h_{t-1} + W_x x_t + b)\"}],[\"$\",\"p\",null,{\"children\":[\"At each time step the network reads one input \",[\"$\",\"$La\",null,{\"children\":\"x_t\"}],\" and updates a hidden state\",\" \",[\"$\",\"$La\",null,{\"children\":\"h_t\"}],\". The same weight matrices \",[\"$\",\"$La\",null,{\"children\":\"W_h\"}],\" and \",[\"$\",\"$La\",null,{\"children\":\"W_x\"}],\" are reused at every step, shown in the unrolled diagram. The output at step \",[\"$\",\"$La\",null,{\"children\":\"t\"}],\" can depend on all earlier inputs through the chain of hidden states.\"]}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"Plain RNNs struggle on long sequences because backpropagation through time multiplies many Jacobian terms, the same vanishing gradient problem from chapter 5.\"}]]}],\"viz\":[\"$\",\"$Lb\",null,{}]},{\"id\":\"ch06-04\",\"title\":\"LSTM intuition\",\"eyebrow\":\"Sequences\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"Long Short Term Memory (LSTM) adds a cell state \",[\"$\",\"$La\",null,{\"children\":\"c_t\"}],\" with gates that control what enters, stays, and leaves:\"]}],[\"$\",\"ul\",null,{\"className\":\"space-y-2 text-[15px]\",\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Forget gate\"}],\" — how much of \",[\"$\",\"$La\",null,{\"children\":\"c_{t-1}\"}],\" to discard\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Input gate\"}],\" — how much new information to write into the cell\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Output gate\"}],\" — how much of the cell to expose as \",[\"$\",\"$La\",null,{\"children\":\"h_t\"}]]}]]}],[\"$\",\"p\",null,{\"children\":\"The cell state gives gradients a path that bypasses repeated matrix multiplies, so signals can persist across many time steps. LSTMs dominated sequence modelling before transformers became standard for language.\"}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"Reference\"}],[\"$\",\"div\",null,{\"children\":[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://www.bioinf.jku.at/publications/older/2604.pdf\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"Hochreiter \u0026 Schmidhuber 1997\"}]}]]}]]}]},{\"id\":\"ch06-05\",\"title\":\"Why attention\",\"eyebrow\":\"Motivation\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"A fixed size hidden state compresses the entire past into one vector. For long sequences or when a distant token directly determines the output, that compression loses information. Attention lets each position read directly from every other position instead of routing everything through a single bottleneck.\"}],[\"$\",\"p\",null,{\"children\":\"Unlike recurrence, attention steps can run in parallel over all positions once the inputs are known, which maps well to GPU matrix multiply. That parallelism is one reason transformers replaced LSTMs for large language models.\"}]]}]},{\"id\":\"ch06-06\",\"title\":\"Scaled dot product attention\",\"eyebrow\":\"Attention\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"Queries \",[\"$\",\"$La\",null,{\"children\":\"Q\"}],\", keys \",[\"$\",\"$La\",null,{\"children\":\"K\"}],\", and values \",[\"$\",\"$La\",null,{\"children\":\"V\"}],\" are linear projections of the input. Attention weights compare every query to every key, then mix the values:\"]}],[\"$\",\"$L8\",null,{\"children\":\"\\\\mathrm{Attention}(Q,K,V) = \\\\mathrm{softmax}\\\\!\\\\left(\\\\frac{QK^\\\\top}{\\\\sqrt{d_k}}\\\\right)V\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":[\"The scale \",[\"$\",\"$La\",null,{\"children\":\"\\\\sqrt{d_k}\"}],\" keeps dot products from growing too large before softmax, which would push weights toward a one hot peak and shrink gradients. Multiple heads run this in parallel with different projections, then concatenate.\"]}]]}],\"viz\":[\"$\",\"$Lc\",null,{}]},{\"id\":\"ch06-07\",\"title\":\"Transformer encoder block\",\"eyebrow\":\"Block\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"One encoder block stacks self attention, a residual add, layer normalisation, a position wise MLP (two linear layers with GELU), then another add and norm. Stacking many blocks builds hierarchical representations without recurrence.\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"Transformers use layer normalisation per token instead of batch normalisation from chapter 5, because sequence length and batch composition vary too much for reliable per batch statistics.\"}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"Reference\"}],[\"$\",\"div\",null,{\"children\":[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://arxiv.org/abs/1706.03762\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"Vaswani et al. 2017\"}]}]]}]]}],\"viz\":[\"$\",\"$Ld\",null,{}]},{\"id\":\"ch06-08\",\"title\":\"CNN preview\",\"eyebrow\":\"Spatial\",\"layout\":\"prose\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Convolution replaces the dense matrix multiply with a small kernel that slides across the input. The same kernel weights are applied at every spatial position: local connectivity plus weight sharing. That is the inductive bias for images.\"}],[\"$\",\"$L8\",null,{\"children\":\"Y[i,j] = \\\\sum_{u,v} X[i{+}u,\\\\,j{+}v]\\\\cdot K[u,v]\"}],[\"$\",\"p\",null,{\"children\":\"Chapter 7 derives the math, receptive field, pooling, and the ImageNet lineage from LeNet through ResNet. For mission computer vision, CNN backbones remain the default feature extractor even when a transformer head sits on top.\"}]]}]},{\"id\":\"ch06-09\",\"title\":\"Multimodal models\",\"eyebrow\":\"Fusion\",\"layout\":\"split\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Multimodal models process more than one input type. A common pattern is dual encoders: one network for images, one for text, each mapping into a shared embedding space. Training pulls matched pairs together and pushes unrelated pairs apart, as in CLIP.\"}],[\"$\",\"p\",null,{\"className\":\"text-muted\",\"children\":\"At inference, text embeddings can rank images or images can rank text without retraining the encoders. Larger systems such as LLaVA attach a vision encoder to a language model for open ended description.\"}],[\"$\",\"aside\",null,{\"className\":\"rounded-md border px-4 py-3 text-sm leading-relaxed border-stroke bg-surface text-ink\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-1 font-mono text-[11px] uppercase tracking-[0.12em] text-muted\",\"children\":\"Reference\"}],[\"$\",\"div\",null,{\"children\":[\"$\",\"a\",null,{\"className\":\"underline\",\"href\":\"https://arxiv.org/abs/2103.00020\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"children\":\"Radford et al. 2021 (CLIP)\"}]}]]}]]}],\"viz\":[\"$\",\"$Le\",null,{}]},{\"id\":\"ch06-10\",\"title\":\"Combining blocks in practice\",\"eyebrow\":\"Stacks\",\"layout\":\"scrollProse\",\"content\":[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Modern models mix blocks rather than using one family
